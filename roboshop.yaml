- name: creating ec2 user
  connection: local
  hosts: local
  #become: yes
  vars:
    instances: [ "mongodb", "redis", "mysql", "rabbitMQ", "catalogue", "user", "cart", "shipping", "payment", "frontend" ]
    action: create
    ami_id: ami-0055977a6e828a4f4
    domain_name: jkrdigital.store
  tasks:
  - name: creating ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      region: us-east-1
      instance_type: t3.micro
      image_id: "{{ ami_id }}"
      security_groups:
      - roboshop-common
      - "roboshop-{{ item }}"
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output

  # - name: print the ec2_output
  #   debug:
  #     msg: "{{ ec2_output }}"  

  - name: Creating Route53 Record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"   #mongodb.jkrdigital.store
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"

  - name: Creating Route53 Record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"   #jkrdigital.store --> pointing to frontend public ip
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"  and item.item == "frontend"

  - name: Delete Route53 record
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}"  
      type: A
      ttl: 1
    loop: "{{ instances }}"
    when: action == "delete"  

  - name: Deleting frontend Route53 record
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"  
      type: A
      ttl: 1
    loop: "{{ instances }}"
    when: action == "delete"

  - name: Delete Ec2 instance
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"  
      region: us-east-1
      wait: false
    loop: "{{ instances }}"
    when: action == "delete"  