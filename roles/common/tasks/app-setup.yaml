- name: create roboshop system user
  user: 
    name: roboshop
    create_home: false
    home: /app 
    system: true
    shell: /sbin/nologin
    comment: "roboshop system user"

- name: remove existing app directory
  file:
    path: /app
    state: absent

- name: remove {{ component }}.zip
  file:
    path: /tmp/{{ component }}.zip
    state: absent

- name: create app directory
  file:
    path: /app
    state: directory

- name: downloading the {{ component }} code
  get_url:
    url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/{{ component }}-v4.zip
    dest: /tmp/{{ component }}.zip

- name:  unarchive the code into /app
  unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes
