- name: copy rabbitmq repo
  copy:
    src: rabbitmq.repo
    dest: /etc/yum.repos.d/rabbitmq.repo

- name: Installing rabbitMQ
  package:
    name: 
    - erlang
    - rabbitmq-server
    state: present

- name: Enable and Starting
  service:
    name: rabbitmq-server
    state: started
    enabled: yes
    
- name: Creating user and setting up permissions
  community.rabbitmq.rabbitmq_user:
    user: "{{ rabbitmq_user }}" #roboshop
    password: "{{ rabbitmq_password }}"
    vhost: /
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    state: present