- name: application setup
  include_role:
    name: common
    tasks_from: app-setup

- name: nodejs setup
  include_role:
    name: common
    tasks_from: nodejs    

- name: systemd setup
  include_role:
    name: common
    tasks_from: systemd-setup 

- name: mvn version without JAVA_HOME
  command: mvn --version
  args: 
    chdir: /app  
  register: mvn_default

- name: print mvn version without JAVA_HOME
  debug:
    msg: "{{ mvn_default.stdout_lines }}"    

- name: Build shipping dependencies
  command: mvn clean package
  args:
    chdir: /app

- name: Move shiping jar file
  command: mv target/shipping.jar  shipping.jar
  args:
    chdir: /app

- name: check cities data exist or not
  command: mysql -h "{{ mysql_host }}" -u root -p{{ mysql_root_password }} -N -B -e "SELECT COUNT(*) FROM cities.cities;"
  register: cities_count
  ignore_errors: true
  tags:
  - mysql    

- name: Print cities count
  debug:
    msg: "{{ cities_count }}"
  tags:
  - mysql  

- name: Loading cities data
  shell: mysql -h {{ mysql_host }} -uroot -pRoboShop@1 < /app/db/master-data.sql    
  when: cities_count.rc != 0 or cities_count.stdout | int == 0
  tags:
  - mysql

- name: create app user
  shell: mysql -h {{ mysql_host }} -uroot -p{{ mysql_root_password}} < /app/db/app-user.sql 
  tags:
  - mysql 

- name: demon reload and app restart
  include_role:
    name: common
    tasks_from: restart  

