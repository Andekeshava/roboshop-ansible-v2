- name: application setup
  include_role:
    name: common
    tasks_from: app-setup

- name: nodejs setup
  include_role:
    name: common
    tasks_from: nodejs    

- name: systemd setup
  include_role:
    name: common
    tasks_from: systemd-setup 

- name: demon reload and app restart
  include_role:
    name: common
    tasks_from: restart      





